<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="outer-container">
            <div class="screen">
                2+7
            </div>
            <div class="buttons">
                <div class="first-row">
                    <button>X</button>
                    <button>AC</button>
                    <button>%</button>
                    <button>/</button>
                </div>
                <div class="second-row">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>*</button>
                </div>
                <div class="third-row">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>-</button>
                </div>
                <div class="forth-row">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>+</button>
                </div>
                <div class="forth-row">
                    <button></button>
                    <button>0</button>
                    <button></button>
                    <button>=s</button>
                </div>
            </div>
        </div>
    </body>
</html>
