<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="outer-container">
            <div class="inner-container"> 
            <div class="screen">
                2+7
            </div>
            <div class="buttons">
                <div class="first-row">
                    <button class="first">X</button>
                    <button class="first">%</button>
                    <button class="first">/</button>
                </div>
                <div class="second-row">
                    <button class="second">7</button>
                    <button class="second">8</button>
                    <button class="second">9</button>
                    <button class="operator">*</button>
                </div>
                <div class="third-row">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button class="operator">-</button>

                </div>
                <div class="forth-row">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button class="operator">+</button>
                </div>
                <div class="fifth-row">
                    <button>0</button>
                    <button class="operator">=</button>
                </div>
            </div>
            </div>
        </div>
    </body>
</html>
