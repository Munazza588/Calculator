<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="outer-container">
            <div class="inner-container"> 
            <div class="screen">
                <p class="first-num"></p>
                <p class="op"></p>
                <p class="second-num"></p>
            </div>
            <div class="buttons">
                <div class="first-row">
                    <button class="first clear">X</button>
                    <button class="first operation">%</button>
                    <button class="first operation">/</button>
                </div>
                <div class="second-row">
                    <button class="second numbers">7</button>
                    <button class="second numbers">8</button>
                    <button class="second numbers">9</button>
                    <button class="operator operation">*</button>
                </div>
                <div class="third-row">
                    <button class="numbers">4</button>
                    <button class="numbers">5</button>
                    <button class="numbers">6</button>
                    <button class="operator operation">-</button>

                </div>
                <div class="forth-row">
                    <button class="numbers">1</button>
                    <button class="numbers">2</button>
                    <button class="numbers">3</button>
                    <button class="operator operation">+</button>
                </div>
                <div class="fifth-row">
                    <button class="numbers">0</button>
                    <button class="operator calculate">=</button>
                </div>
            </div>
            </div>
        </div>
    </body>
</html>
